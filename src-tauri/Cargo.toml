[package]
name = "qclean"
version = "1.0.0"
description = "QClean — a native cleanup utility for macOS, Linux and Windows"
authors = ["bkrajendra"]
edition = "2021"
rust-version = "1.77"
license = "Apache-2.0"
repository = "https://github.com/febritecno/qclean"
default-run = "qclean"

[lib]
name = "qclean_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "qclean"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
qclean-core = { path = "crates/qclean-core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
core-foundation = "0.10"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[workspace]
members = ["crates/qclean-core"]

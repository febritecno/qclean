[package]
name = "qclean-core"
version = "1.0.0"
description = "QClean filesystem, safety and cleanup-rules engine (no UI, no Tauri)"
edition = "2021"
rust-version = "1.77"
license = "Apache-2.0"
repository = "https://github.com/febritecno/qclean"

[lib]
name = "qclean_core"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
plist = "1"
dunce = "1"
dirs = "7"
log = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
